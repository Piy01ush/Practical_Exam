<!DOCTYPE html>
<html>
<body>

<h2>Users</h2>
<ul id="list"></ul>

<script>
fetch("https://jsonplaceholder.typicode.com/users")
  .then(res => res.json())
  .then(data => {
    let output = "";

    data.forEach(user => {
      output += "<li>" + user.name + "</li>";
    });

    document.getElementById("list").innerHTML = output;
  });
</script>

</body>
</html>
